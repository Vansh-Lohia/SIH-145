# docker-compose.yml
services:
  victim:
    build: ./victim
    container_name: victim
    networks:
      - labnet

  attacker:
    build: ./attacker
    container_name: attacker
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - labnet
    depends_on:
      - victim
    tty: true

  monitor:
    build: ./monitor
    container_name: monitor
    network_mode: "service:victim"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - victim
    volumes:
      - ./captures:/captures

  dns_server:
    build: ./dns_server
    container_name: dns_server
    cap_add:
      - NET_ADMIN
    networks:
      - labnet

networks:
  labnet:
    driver: bridge