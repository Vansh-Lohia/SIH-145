[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recon_detector"
version = "0.1.0"
description = "Passive, one-way reconnaissance / port-scan detector (SIH 26145, threat class #5)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
recon-detector = "recon_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
