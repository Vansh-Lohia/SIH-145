# Two Linux hosts on one bridge network, mirroring your teammate's
# 10.10.10.2 (attacker) / 10.10.10.3 (victim) addressing.
services:
  victim:
    build: .
    container_name: victim
    cap_add: [NET_ADMIN]
    networks:
      scanlab:
        ipv4_address: 10.10.10.3
    # Open a handful of realistic ports so the scan finds a mix of
    # open + closed, then idle.
    command: >
      bash -c "for p in 22 80 443 3306 8080; do ncat -lk -p $$p -e /bin/cat & done; sleep infinity"

  attacker:
    build: .
    container_name: attacker
    depends_on: [victim]
    cap_add: [NET_RAW, NET_ADMIN]   # needed for tcpdump + nmap raw sockets
    networks:
      scanlab:
        ipv4_address: 10.10.10.2
    command: ["sleep", "infinity"]

networks:
  scanlab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
